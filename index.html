<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanök Regular — Website soon</title>

<link rel="apple-touch-icon" href="design/stub/apple-touch-icon.png">
<style>
  /* Desktop frame 110:1711 is 1440×800. Mobile frame 141:1647 is 375×812.
     --k scales a frame from its own width. Mobile shows through 440px.
     Desktop columns stretch: margin 12, gutter 12, count 12. */
  :root {
    --bg: #d7d7d7;
    --blue: #0c6df4;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    /* Visual viewport. JS overwrites these when Safari chrome shifts it. */
    --vvh: 100dvh;
    --vv-top: 0px;
    --vv-lift: 0px;
  }
  html[data-theme="1"] {
    --blue: #8A7E59;
    --bg: hsl(303.8182deg 100% 78.4314%);
  }
  html[data-theme="2"] {
    --blue: #E3F4E8;
    --bg: linear-gradient(180deg, #A59D90 0%, #02DD67 100%);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg) fixed;
    cursor: pointer;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  html {
    height: 100svh;
    height: 100dvh;
  }

  body {
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }

  .frame {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--bg) fixed;
  }

  .desk {
    --k: calc(100vw / 1440);
    /* Stretch columns on the desktop frame. Margin and gutter stay 12px. */
    --grid-margin: 12px;
    --grid-gutter: 12px;
    /* 100vw, not 100%: a percentage would resolve against height inside top/height. */
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    /* Bio is one 16*k line at 12*k. The clear gap under that block is 24px at every width. */
    --wordmark-top: calc(28 * var(--k) + 24px);
    height: calc(800 * var(--k));
    background: var(--bg) fixed;
  }
  .mob {
    --k: calc(100vw / 375);
    /* Bio is three 14*k lines at 16*k. The clear gap under that block is 24px at every width. */
    --wordmark-top: calc(58 * var(--k) + 24px);
    height: 100%;
    display: none;
    background: var(--bg) fixed;
  }

  .frame p { margin: 0; position: absolute; }

  .frame img { position: absolute; display: block; max-width: none; }

  .crosshair {
    position: absolute;
    z-index: 9;
    left: calc(11.06 * var(--k));
    top: calc(11.23 * var(--k));
    width: calc(21.535 * var(--k));
    height: calc(21.535 * var(--k));
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    line-height: 0;
    cursor: pointer;
  }
  .crosshair svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .bio {
    font-size: calc(14 * var(--k));
    line-height: normal;
    white-space: nowrap;
  }

  .desk .bio {
    left: calc(var(--grid-margin) + (var(--col) + var(--grid-gutter)));
    top: calc(12 * var(--k));
    line-height: calc(16 * var(--k));
  }

  .soon {
    font-size: calc(14 * var(--k));
    line-height: normal;
    white-space: nowrap;
  }

  .desk .soon {
    top: calc(12 * var(--k));
    right: var(--grid-margin);
  }

  .desk .vanok {
    left: var(--letter-left);
    top: var(--wordmark-top);
    width: calc(var(--letter-w) * 335.72991943359375 / 701.996826171875);
    height: calc(var(--letter-w) * 233.0081329345703 / 701.996826171875);
  }

  .desk .regular {
    left: calc(var(--letter-left) + var(--letter-w) * 241.17164611816406 / 701.996826171875);
    top: calc(var(--wordmark-top) + var(--letter-w) * 35.594642639160156 / 701.996826171875);
    width: calc(var(--letter-w) * 460.824951171875 / 701.996826171875);
    height: calc(var(--letter-w) * 193.93946838378906 / 701.996826171875);
  }

  .frame .lettering { display: none; }
  html[data-theme="1"] .frame .lettering-1,
  html[data-theme="2"] .frame .lettering-2 { display: block; }
  html[data-theme="1"] .vanok,
  html[data-theme="1"] .regular,
  html[data-theme="2"] .vanok,
  html[data-theme="2"] .regular { display: none; }

  .desk .lettering-1,
  .desk .lettering-2 {
    left: var(--letter-left);
    top: var(--wordmark-top);
    width: var(--letter-w);
  }
  .desk .lettering-1 {
    height: calc(var(--letter-w) * 135 / 619);
  }
  .desk .lettering-2 {
    height: calc(var(--letter-w) * 109 / 619);
  }

  .sign { position: absolute; }

  .desk .sign {
    left: calc(50% - 152 * var(--k));
    top: calc(442 * var(--k));
    width: calc(304 * var(--k));
  }

  .sign-line {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(1 * var(--k));
    background: var(--blue);
  }

  .sign p {
    left: 0;
    width: 100%;
    text-align: center;
    line-height: 1;
    white-space: nowrap;
  }

  .desk .sign p {
    top: calc(8 * var(--k));
    font-size: calc(14 * var(--k));
  }

  .mob .bio {
    left: calc(194 * var(--k));
    top: calc(16 * var(--k));
    width: calc(157 * var(--k));
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
    white-space: normal;
  }

  /* Bottom row is 24*k above the visible viewport, not the old 812 frame.
     --vv-lift shifts it up when Safari's layout viewport is taller. */
  .mob .soon {
    position: fixed;
    right: calc(24 * var(--k));
    bottom: calc(24 * var(--k) + var(--vv-lift));
    height: calc(14 * var(--k));
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .mob .crosshair {
    position: absolute;
    left: calc(23.231 * var(--k));
    top: calc(23.231 * var(--k));
    bottom: auto;
    width: calc(21.535 * var(--k));
    height: calc(21.535 * var(--k));
  }

  .mob .vanok {
    left: calc(24 * var(--k));
    top: var(--wordmark-top);
    width: calc(156.387 * var(--k));
    height: calc(108.538 * var(--k));
  }

  .mob .regular {
    left: calc(136.341 * var(--k));
    top: calc(var(--wordmark-top) + (93.593 - 77) * var(--k));
    width: calc(214.658 * var(--k));
    height: calc(90.339 * var(--k));
  }

  .mob .lettering-1,
  .mob .lettering-2 {
    left: calc(24 * var(--k));
    top: var(--wordmark-top);
    width: calc(327 * var(--k));
  }
  .mob .lettering-1 { height: calc(71.32 * var(--k)); }
  .mob .lettering-2 { height: calc(57.57 * var(--k)); }

  /* Sign line sits at y=465 on the 375×812 frame. Width scale only, so theme changes do not move it. */
  .mob .sign {
    left: calc(74.25 * var(--k));
    top: calc(465 * var(--k));
    width: calc(226.492 * var(--k));
  }

  .mob .sign-line {
    width: calc(226.492 * var(--k));
  }

  .mob .sign p {
    left: 0;
    width: 100%;
    text-align: center;
    top: calc(6.625 * var(--k));
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .ig-link,
  .catalog-entry {
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    line-height: normal;
    text-decoration-line: underline;
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    white-space: nowrap;
    cursor: pointer;
  }
  .desk .ig-link,
  .desk .catalog-entry {
    position: absolute;
    top: calc(12 * var(--k));
    font-size: calc(14 * var(--k));
  }
  .desk .ig-link { left: var(--letter-left); }
  .desk .catalog-entry {
    left: calc(var(--grid-margin) + 9 * (var(--col) + var(--grid-gutter)));
  }
  .mob .ig-link {
    position: fixed;
    left: calc(24 * var(--k));
    top: auto;
    bottom: calc(24 * var(--k) + var(--vv-lift));
    height: calc(14 * var(--k));
    display: flex;
    align-items: center;
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .site-credits {
    z-index: 4;
    margin: 0;
    color: color-mix(in srgb, var(--blue) 48%, transparent);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: calc(14 * var(--k));
    line-height: normal;
    text-decoration: none;
    white-space: nowrap;
    writing-mode: vertical-rl;
    cursor: pointer;
  }
  .desk .site-credits {
    position: fixed;
    right: 12px;
    bottom: 12px;
  }
  .mob .site-credits {
    display: none;
    font-size: calc(12 * var(--k));
  }
  .site-credits .credits-name {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
  }
  @media (hover: hover) {
    .site-credits:hover .credits-full { visibility: hidden; }
    .site-credits:hover .credits-name { visibility: visible; }
  }

  @media (max-width: 440px) {
    .desk { display: none; }
    .mob {
      display: block;
      height: 100svh;
      height: 100dvh;
      max-height: 100dvh;
    }
  }

  #sign-host {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .sign-stage {
    position: fixed;
    pointer-events: none;
    z-index: 8;
  }
  .sign-imprints {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .sign-imprint {
    position: absolute;
    display: block;
    transform-origin: center center;
    pointer-events: none;
  }
  .sign-imprint .ink {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
  }
  .sign-imprint .dye {
    position: absolute;
    inset: 0;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .stamp-panel {
    position: fixed;
    z-index: 100;
    right: 16px;
    bottom: 16px;
    width: min(300px, calc(100vw - 32px));

    overflow: auto;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: #0c6df4;
    border: 1px solid #0c6df4;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }

  .apple-light { touch-action: auto; }
  .stamp-panel[hidden] { display: none; }
  .stamp-panel h2 {
    margin: 0;
    padding-right: 52px;
    font-size: 14px;
    font-weight: 400;
  }
  .stamp-panel .hint { margin: 4px 0 8px; }
  .stamp-panel .tabs { display: flex; gap: 6px; margin: 0 0 8px; }
  .stamp-panel .tabs button {

  .stamp-panel .tabs button.on { background: #0c6df4; color: #e1e1e1; }
  .stamp-panel .pane[hidden] { display: none; }
  .stamp-panel .close {

    top: 8px;

    border: 0;
    background: transparent;

    padding: 2px 4px;
  }
  .stamp-panel label.row { display: block; margin-top: 8px; }
  .stamp-panel label.row span { display: flex; justify-content: space-between; gap: 8px; }
  .stamp-panel b { font-weight: 400; }
  .stamp-panel i { font-style: normal; }
  .stamp-panel input[type="range"] {
    display: block;

  }
  .stamp-panel select,
  .stamp-panel input[type="color"] {

    margin-top: 4px;
    color: #0c6df4;
    background: #e8e8e8;
    border: 1px solid #0c6df4;
    font: inherit;
  }
  .stamp-panel input[type="color"] { height: 24px; padding: 0; }
  .stamp-panel .checks {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .stamp-panel .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stamp-panel .checks input { accent-color: #0c6df4; }
  .stamp-panel .meta { margin: 10px 0 0; }
  .stamp-panel .meta p { margin: 0 0 4px; }
  .stamp-panel .thumbs { display: flex; gap: 6px; margin-top: 6px; }
  .stamp-panel .thumbs button {
    width: 84px;
    height: 46px;
    padding: 2px;
    border: 1px solid rgba(12, 109, 244, 0.35);

  }
  .stamp-panel .thumbs button.on { border-color: #0c6df4; box-shadow: inset 0 0 0 1px #0c6df4; }
  .stamp-panel .thumbs img { width: 100%; height: 100%; object-fit: contain; }
  .apple-view {

    inset: 0;

  }
  .apple-view canvas { display: block; width: 100%; height: 100%; }
  .apple-light {

    z-index: 100;

    bottom: 52px;
    width: min(280px, calc(100vw - 32px));
    max-height: min(640px, calc(100vh - 80px));
    overflow: auto;
    margin: 0;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: #0c6df4;
    border: 1px solid #0c6df4;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }
  .apple-light[hidden] { display: none; }
  .apple-light h2 {

  }

  }
  .apple-light .hint { margin: 4px 0 0; }
  .apple-light .close {

    right: 8px;
    border: 0;
    background: transparent;
    color: #0c6df4;
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
  }
  .apple-light label.row { display: block; margin-top: 8px; }
  .apple-light label.row span { display: flex; justify-content: space-between; gap: 8px; }
  .apple-light b { font-weight: 400; }
  .apple-light i { font-style: normal; font-variant-numeric: tabular-nums; }
  .apple-light input[type="range"] {
    display: block;

  }
  .apple-light select {

  /* Intro plays on the real sign line. The label follows it. Everything else waits. */
  .sign-line {
    transform-origin: center center;
    animation: vanok-sign-open 640ms ease both;
  }
  @keyframes vanok-sign-open {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .sign p {
    animation: vanok-sign-label 400ms ease 480ms both;
  }
  @keyframes vanok-sign-label {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  html.page-ready .sign-line,
  html.page-ready .sign p { animation: none; }
  html.page-ready .sign-line { transform: scaleX(1); }
  html.page-ready .sign p { opacity: 1; }

  .vanok,
  .regular,
  .lettering,
  .bio,
  .soon,
  .crosshair,
  .draw-sig-btn,
  .catalog-entry,
  .ig-link,
  .site-credits,

  .apple-view {
    opacity: 0;
    transition: opacity 500ms ease;
  }
  html.page-ready .vanok,
  html.page-ready .regular,
  html.page-ready .lettering,
  html.page-ready .bio,
  html.page-ready .soon,
  html.page-ready .crosshair,
  html.page-ready .draw-sig-btn,
  html.page-ready .catalog-entry,
  html.page-ready .ig-link,
  html.page-ready .site-credits,

    opacity: 1;

  html:not(.page-ready) .crosshair,
  html:not(.page-ready) .draw-sig-btn,

  .draw-sig-btn {
    position: fixed;
    z-index: 9;
    left: 50%;
    bottom: 16px;
    width: 77px;
    height: 77px;
    margin: 0;
    padding: 0;
    border: 0;
    transform: translateX(-50%);
    background: transparent;
    cursor: pointer;
  }
  .draw-sig-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: transparent;
  }
  .draw-sig-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background-color: var(--blue);
    -webkit-mask: url("design/stub/sig-entry-circle.svg") center / contain no-repeat;
    mask: url("design/stub/sig-entry-circle.svg") center / contain no-repeat;
    pointer-events: none;
  }
  @media (max-width: 440px) {
    .draw-sig-btn {
      --k: calc(100vw / 375);
      width: calc(77 * var(--k));
      height: calc(77 * var(--k));
      bottom: calc(var(--vv-lift) - 7 * var(--k));
      left: calc(50% - 1px);
    }
  }
  @media (min-width: 441px) {
    .draw-sig-btn { display: none; }
  }

  .sig-modal {
    --sig-k: min(100vw / 375, 100dvh / 812);
    --k: calc(100vw / 375);
    position: fixed;
    inset: 0;
    z-index: 60;
    background: var(--bg) fixed;
    color: var(--blue);
    font-family: var(--grotesk);
    touch-action: manipulation;
    opacity: 0;
    transition: opacity 240ms ease-out;
  }
  .sig-modal.is-open { opacity: 1; }
  .sig-modal[hidden] { display: none; }
  .sig-editor, .sig-library, .sig-shapes {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 0;
    transition: opacity 240ms ease-out, visibility 0s linear 240ms;
  }
  .sig-editor.is-on, .sig-library.is-on, .sig-shapes.is-on {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    z-index: 1;
    transition: opacity 240ms ease-out, visibility 0s linear 0s;
  }
  .sig-editor, .sig-shapes { overflow: hidden; }
  .sig-library { overflow: hidden; }
  .sig-head, .sig-head-side { display: contents; }
  .sig-shapes .sig-back,
  .sig-editor .sig-close { display: none; }

    .sig-modal, .sig-editor, .sig-library, .sig-shapes { transition: none; }
  }
  .sig-close, .sig-back {

    left: 24px;

    padding: 0;

    content: "";

    top: 0;
    width: 14px;
    height: 14px;
    background-color: var(--blue);
    pointer-events: none;
  }
  .sig-close::after, .sig-back::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 7px;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
  }
  .sig-close::before {
    -webkit-mask: url("design/stub/seal-close.svg") left top / 14px 14px no-repeat;
    mask: url("design/stub/seal-close.svg") left top / 14px 14px no-repeat;
  }
  .sig-back::before {
    -webkit-mask: url("design/stub/sig-back.svg") left center / contain no-repeat;
    mask: url("design/stub/sig-back.svg") left center / contain no-repeat;
  }
  .sig-title {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;

<script>
  (function () {
    var themes = ['0', '1', '2'];
    var root = document.documentElement;
    if (!root.dataset.theme) root.dataset.theme = '0';
    window.__vanokIntroT0 = performance.now();
    setTimeout(function () {
      if (root.classList.contains('page-ready')) return;
      root.classList.add('page-ready');
      window.__vanokStampsAt = performance.now() + 500;
    }, 8000);
    function cycle(event) {
      event.preventDefault();
      var i = themes.indexOf(root.dataset.theme || '0');
      if (i < 0) i = 0;
      root.dataset.theme = themes[(i + 1) % themes.length];
      root.dispatchEvent(new CustomEvent('vanok-theme'));
    }
    var buttons = document.querySelectorAll('.crosshair');
    for (var n = 0; n < buttons.length; n++) buttons[n].addEventListener('click', cycle);

    document.addEventListener('keydown', function (event) {
      if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.code !== 'KeyR') return;
      var el = event.target;
      if (el && (el.isContentEditable || (el.closest && el.closest('input, textarea, [contenteditable="true"]')))) return;
      var grid = document.querySelector('.layout-grid');
      if (!grid) return;
      event.preventDefault();
      grid.hidden = !grid.hidden;
      grid.setAttribute('aria-hidden', grid.hidden ? 'true' : 'false');
    });

    function syncViewport() {
      var vv = window.visualViewport;
      var layoutH = window.innerHeight || root.clientHeight || 0;
      var top = vv ? vv.offsetTop : 0;
      var h = vv ? vv.height : layoutH;
      var lift = Math.max(0, layoutH - top - h);
      root.style.setProperty('--vv-top', top + 'px');
      root.style.setProperty('--vvh', h + 'px');
      root.style.setProperty('--vv-lift', lift + 'px');
    }
    syncViewport();
    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', syncViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }

    document.addEventListener('touchmove', function (event) {
      var t = event.target;
      if (t && t.closest) {
        var panel = t.closest('.stamp-panel, .apple-light, .sig-modal');
        if (panel && !panel.hidden) return;
      }
      if (event.cancelable) event.preventDefault();
    }, { passive: false, capture: true });
  })();

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const gltfLoads = new Map();
function loadGltf(url) {
  let job = gltfLoads.get(url);
  if (!job) {
    job = new Promise((resolve) => {
      new GLTFLoader().load(url, (gltf) => resolve(gltf), undefined, () => resolve(null));
    });
    gltfLoads.set(url, job);
  }
  return job;
}
loadGltf('models/apple_green_quaternius.glb');

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

const APPLE_FILE = 'models/apple_green_quaternius.glb';
const STAMP_FILE = 'models/stamp_round.glb';
const APPLE_GREEN = 0x67c514;
const APPLE_RED = 0xe23b32;
const STAMP_GREEN = 0x67c514;

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (skinHex != null && (m.name === 'PaleGreen' || m.name === 'green')) {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  paintApple(model);
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
  return fitTopDown(model);
}

function decodeIntroImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    const finish = () => resolve();
    img.onload = () => {
      if (typeof img.decode === 'function') img.decode().then(finish, finish);
      else finish();
    };
    img.onerror = finish;
    img.src = src;
  });
}

const INTRO_BEAT_MS = 1000;
const INTRO_FADE_MS = 500;
const INTRO_LIMIT_MS = 8000;

function revealTeaser() {
  const root = document.documentElement;
  if (root.classList.contains('page-ready')) return;
  root.classList.add('page-ready');
  window.__vanokStampsAt = performance.now() + INTRO_FADE_MS;
}

  'design/stub/crosshair.svg',
  'design/stub/line.svg',
];
const introT0 = window.__vanokIntroT0 || performance.now();
Promise.race([
  Promise.all([
    loadGltf('models/apple_green_quaternius.glb'),
    loadGltf('models/apple_half_green.glb'),
    loadGltf('models/stamp_round.glb'),
    ...introImages.map(decodeIntroImage),
  ]),
  new Promise((resolve) => setTimeout(resolve, INTRO_LIMIT_MS)),
]).then(() => {
  const wait = Math.max(0, INTRO_BEAT_MS - (performance.now() - introT0));
  setTimeout(revealTeaser, wait);
});

  const tabs = document.createElement('div');

  function showPane(which) {

    stampPane.hidden = !stampOn;

  appleTab.addEventListener('click', () => showPane('apple'));
  const scrollHost = document.createElement('div');
  addSlider(scrollHost, pageScroll, 'Ускорение лент при скролле', 'boost', 1, 30, 0.5, (n) => n.toFixed(1) + '×', false);
  panel.append(scrollHost, tabs, stampPane, applePane);

  let alive = true;
  let stampModel = null;
  let appleModel = null;
  let pressN = 0;
  let lastNow = 0;
  const marks = [];
  const flights = [];
  const queued = [];

  function refreshFiles() {
    for (const ui of fileUis) {
      const show = ui.rig.file === 'random' ? ui.lastPlaced : ui.rig.file;
      ui.next.textContent = ui.rig.file === 'random'
        ? 'Дальше: случайный'
        : 'Дальше: ' + ui.rig.file;

  refreshFiles();

  function placeInk(current) {
    if (current.placed || !current.src) return;
    current.placed = true;
    if (current.rig.stack === 'replace') {
      for (let i = marks.length - 1; i >= 0; i--) {
        if (marks[i].kind !== current.kind) continue;
        marks[i].el.remove();
        marks.splice(i, 1);
      }
    }
    const el = document.createElement('div');
    el.className = 'sign-imprint';
    const img = document.createElement('img');
    img.className = 'ink';
    img.alt = '';
    img.draggable = false;
    img.src = current.src;
    const dye = document.createElement('div');
    dye.className = 'dye';
    dye.style.webkitMaskImage = `url("${current.src}")`;
    dye.style.maskImage = `url("${current.src}")`;
    el.append(img, dye);
    layer.append(el);
    marks.push({
      el,
      dye,
      kind: current.kind,
      rot: current.rot,
      px: current.px,
      py: current.py,
      castHex: current.castHex,
      custom: !!current.custom,
    });
    const ui = fileUis.find((item) => item.kind === current.kind);
    if (ui) {
      ui.lastPlaced = current.file;
      ui.last.textContent = 'Поставлен: ' + current.file;
    }
    paintMarks();
  }
  const colorDeck = [];
  let lastColor = '';
  function drawColor() {
    if (!colorDeck.length) {
      const colors = ['blue', 'pink', 'green'];
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      if (colors[colors.length - 1] === lastColor) {
        [colors[0], colors[colors.length - 1]] = [colors[colors.length - 1], colors[0]];
      }
      colorDeck.push(...colors);
    }
    lastColor = colorDeck.pop();
    return lastColor;
  }
  function castFromCustom(item) {
    const themed = themeHex(item.castHex);
    return {
      file: item.id,
      src: item.src,
      castHex: item.castHex,
      bodyHex: themed == null ? item.castHex : themed,
      custom: true,
    };
  }
  function castFromStock(kind, cast) {
    const list = kind === 'apple' ? APPLE_IMPRINTS : STAMP_IMPRINTS;
    const imprint = list.find((item) => item.file === cast.file) || list[0];
    const themed = themeHex(cast.hex);
    return { ...imprint, castHex: cast.hex, bodyHex: themed == null ? cast.hex : themed };
  }
  function fileOf(item) {
    return String(item && item.src || '').split('/').pop().split('?')[0];
  }
  function castFromLibrary(item) {
    if (item && item.preset) {
      const file = fileOf(item);
      const casts = item.kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
      const stock = casts.find((cast) => cast.file === file);
      if (stock) return castFromStock(item.kind, stock);
      const hex = Number.isFinite(item.castHex) ? item.castHex : 0x0c6df4;
      const themed = themeHex(hex);
      return {
        file: file || item.id,
        src: item.src,
        castHex: hex,
        bodyHex: themed == null ? hex : themed,
        custom: false,
      };
    }
    return castFromCustom(item);
  }
  function optionId(item) {
    const store = window.VanokSignatures;
    return store && typeof store.placeKey === 'function' ? store.placeKey(item) : item.id;
  }
  function pickCast(kind) {
    const store = window.VanokSignatures;
    const rig = kind === 'apple' ? appleRig : stampRig;
    const casts = kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
    if (store && rig.file === 'random') {
      const forced = store.takeNext(kind);
      if (forced) {
        lastColor = forced.colorName || lastColor;
        store.rememberPlaced(kind, optionId(forced));
        return castFromLibrary(forced);
      }
      const customs = store.pool(kind);
      if (!customs.length) return null;
      {
        const options = customs.map((item) => ({ id: optionId(item), item }));
        let bag = options;
        const last = store.lastPlaced(kind);
        if (options.length > 1 && last) {
          const fresh = options.filter((entry) => entry.id !== last);
          if (fresh.length) bag = fresh;
        }
        const choice = bag[Math.floor(Math.random() * bag.length)];
        store.rememberPlaced(kind, choice.id);
        if (choice.item) {
          lastColor = choice.item.colorName || lastColor;
          return castFromLibrary(choice.item);
        }
        lastColor = choice.cast.color;
        return castFromStock(kind, choice.cast);
      }
    }
    let cast = casts.find((item) => item.file === rig.file);
    if (!cast) {
      const color = drawColor();
      cast = casts.find((item) => item.color === color) || casts[0];
    } else {
      lastColor = cast.color;
    }
    return castFromStock(kind, cast);
  }

  // Theme 2 recolours every ink. Theme 1 turns every ink white.
  function themeHex(ink) {
    const theme = document.documentElement.dataset.theme || '0';
    if (theme === '2') return 0xe3f4e8;
    if (theme === '1') return 0xffffff;
    return null;
  }

  function sampleShot(point, rig, kind) {
    const choice = pickCast(kind);
    if (!choice) return null;
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const h = host.clientHeight;
    if (host.clientWidth < 2 || h < 2) return;
    for (const mark of marks) {
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const fitted = (SIZE * rig.scale / viewH) * h;
      // Stock files pad the seal. Custom exports fill the canvas, so they
      // take the seal size: 505/539 on the circle, 460/537 on the apple.
      const imgW = mark.kind === 'apple'
        ? fitted * (mark.custom ? APPLE_INK_FRAC : 1)
        : (mark.custom ? fitted : fitted / INK_FRAC);
      mark.el.style.left = `calc(${mark.px * 100}% + ${rig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${rig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(rig.opacity);
      mark.el.style.filter = rig.blur > 0.01 ? `blur(${rig.blur}px)` : 'none';
      const rot = mark.kind === 'apple' ? rig.pressY - mark.rot : mark.rot;
      mark.el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      const themed = themeHex(mark.castHex);
      if (themed == null) {
        mark.dye.style.opacity = String(rig.tintAmount);
        mark.dye.style.background = rig.tint;
      } else {
        mark.dye.style.opacity = '1';
        mark.dye.style.background = '#' + themed.toString(16).padStart(6, '0');
      }
    }
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : current.rig.printScale);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(flight, prefix) {
    const d = Math.PI / 180;
    const rig = flight.shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(flight, name, u) {
    const start = axisPose(flight, 'start');
    const fly = axisPose(flight, 'fly');
    const press = axisPose(flight, 'press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function paintTool(root, kind, hex) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (kind === 'apple') {
          if (material.name !== 'green' && material.name !== 'PaleGreen') continue;
          material.color.setHex(hex);
          material.emissive.setHex(hex);
          material.emissiveIntensity = 0.08;
          continue;
        }
        const color = new THREE.Color(hex);
        if (node.name === 'Pad') color.multiplyScalar(0.78);
        else if (node.name === 'Handle') color.multiplyScalar(0.9);
        material.color.copy(color);
      }
    });
  }

  function cloneTool(source) {
    const clone = source.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map((material) => material.clone())
        : node.material.clone();
    });
    clone.visible = false;
    scene.add(clone);
    return clone;
  }

  function cloneShadow() {
    const mesh = shadow.clone();
    mesh.material = shadow.material.clone();
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function releaseFlight(flight) {
    scene.remove(flight.model);
    flight.model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.dispose();
    });
    scene.remove(flight.shadow);
    flight.shadow.material.dispose();
    flight.model.visible = false;
    flight.shadow.visible = false;
  }

  function applyPose(flight, x, z, squashAmt, rot, presence, spin) {
    const shot = flight.shot;
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : rig.printScale);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor(flight, 'press', 1);
    const model = flight.model;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    if (shot.bodyHex != null) paintTool(model, shot.kind, shot.bodyHex);
    const shade = flight.shadow;
    shade.visible = true;
    shade.position.set(x + 0.04, 0.002, z + 0.03);
    shade.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shade.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    if (!(performance.now() >= (window.__vanokStampsAt || Infinity))) return;
    if (typeof globalThis.__vanokAppleGesture === 'function' && globalThis.__vanokAppleGesture()) return;
    const armed = window.VanokSignatures && window.VanokSignatures.peekNext();
    const kind = armed ? armed.kind : (pressN % 2 === 0 ? 'stamp' : 'apple');
    const source = kindReady(kind);
    if (!source) {
      queued.push(point);
      return;
    }
    pressN += 1;
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const shot = sampleShot(point, rig, kind);
    if (!shot) return;
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((item) => item.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }

  function placeSeal(item, clientX, clientY) {
    if (!alive || !item || (item.kind !== 'stamp' && item.kind !== 'apple')) return;
    const kind = item.kind;
    const hr = host.getBoundingClientRect();
    const point = { px: clientX - hr.left, py: clientY - hr.top };
    const source = kindReady(kind);
    if (!source) {
      queued.push({ px: point.px, py: point.py, seal: item });
      return;
    }
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const choice = castFromLibrary(item);
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    const shot = {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
    const store = window.VanokSignatures;
    if (store && typeof store.rememberPlaced === 'function') store.rememberPlaced(kind, optionId(item));
    pressN += 1;
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((row) => row.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }
  window.__vanokPlaceSeal = placeSeal;

  function drainQueue() {
    while (queued.length) {
      const next = queued[0];
      if (next && next.seal) {
        const kind = next.seal.kind === 'apple' ? 'apple' : 'stamp';
        if (!kindReady(kind)) return;
        queued.shift();
        const hr = host.getBoundingClientRect();
        placeSeal(next.seal, next.px + hr.left, next.py + hr.top);
        continue;
      }
      const armed = window.VanokSignatures && window.VanokSignatures.peekNext();
      const kind = armed ? armed.kind : (pressN % 2 === 0 ? 'stamp' : 'apple');
      if (!kindReady(kind)) return;
      start(queued.shift());
    }
  }

  function stepFlight(flight, dt) {
    const shot = flight.shot;
    if (flight.phase === 'rest') {
      if (shot.rig.liftAway) {
        flight.phase = 'lift';
        flight.phaseU = 0;
      } else {
        const goal = targetOf(shot);
        applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      }
      return false;
    }
    const goal = targetOf(shot);
    if (flight.phase === 'descend') {
      flight.phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, flight.phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(flight, goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor(flight, 'descend', u));
      if (u >= 1) { flight.phase = 'press'; flight.phaseU = 0; }
    } else if (flight.phase === 'press') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      applyPose(flight, goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'repress') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(flight, goal.x, goal.z, sq, shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'dwell') {
      applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
        flight.phaseU = 0;
      } else {
        flight.phaseU += dt / shot.rig.dwell;
        if (flight.phaseU >= 1) {
          flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
          flight.phaseU = 0;
        }
      }
    } else if (flight.phase === 'lift') {
      flight.phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, flight.phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(flight, goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor(flight, 'lift', u));
      if (u >= 1) {
        releaseFlight(flight);
        return true;
      }
    }
    return false;
  }

  function step(dt) {
    for (let i = flights.length - 1; i >= 0; i--) {
      if (stepFlight(flights[i], dt)) flights.splice(i, 1);
    }
  }

  let stampGesture = 0;
  const stampBlock = '.stamp-panel, .apple-light, .sig-modal, .draw-sig-btn, .catalog-entry, .ig-link, .site-credits, .crosshair, input, select, textarea, button, label';

  function stampBlocked(e) {
    if (!alive || (e.button && e.button !== 0)) return true;
    const t = e.target;
    return !!(t && t.closest && t.closest(stampBlock));
  }

  function dropStamp(e) {
    let x = e.clientX;
    let y = e.clientY;
    if (e.changedTouches && e.changedTouches.length && e.type === 'touchend') {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    }
    const hr = host.getBoundingClientRect();
    start({ px: x - hr.left, py: y - hr.top });
  }

  let introGesture = false;
  function noteIntroGesture() {
    introGesture = !(performance.now() >= (window.__vanokStampsAt || Infinity));
  }
  addEventListener('pointerdown', noteIntroGesture, true);
  addEventListener('touchstart', noteIntroGesture, true);

  function onPointerUp(e) {
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = true;
      return;
    }
    if (stampBlocked(e)) return;
    stampGesture = Date.now();
    dropStamp(e);
  }

  function onClick(e) {
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = false;
      return;
    }
    if (Date.now() - stampGesture < 700) return;
    if (stampBlocked(e)) return;
    dropStamp(e);
  }

  if (window.PointerEvent) addEventListener('pointerup', onPointerUp, true);
  else addEventListener('touchend', onPointerUp, true);
  addEventListener('click', onClick, true);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    group.add(fitted);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  loadGltf('models/stamp_round.glb').then((gltf) => {
    if (!alive || !gltf) return;
    mountTool('stamp', fitTopDown(prepareStamp(gltf.scene)));
  });
  loadGltf('models/apple_half_green.glb').then((gltf) => {
    if (!alive || !gltf) return;
    mountTool('apple', prepareHalfApple(gltf));
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    placeStage();
    renderer.render(scene, camera);
  });

  function applyThemeInk() {
    for (const flight of flights) {
      if (flight.shot.castHex != null) {
        const themed = themeHex(flight.shot.castHex);
        flight.shot.bodyHex = themed == null ? flight.shot.castHex : themed;
      }
    }
    paintMarks();
  }
  document.documentElement.addEventListener('vanok-theme', applyThemeInk);

  return () => {
    alive = false;
    while (flights.length) releaseFlight(flights.pop());
    document.documentElement.removeEventListener('vanok-theme', applyThemeInk);
    removeEventListener('pointerdown', noteIntroGesture, true);
    removeEventListener('touchstart', noteIntroGesture, true);
    if (window.PointerEvent) removeEventListener('pointerup', onPointerUp, true);
    else removeEventListener('touchend', onPointerUp, true);
    removeEventListener('click', onClick, true);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    if (window.__vanokPlaceSeal === placeSeal) delete window.__vanokPlaceSeal;
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Поза шапки до возврата фото: Euler XYZ, как у перетаскивания
// (горизонталь — Y, вертикаль — X, Shift / правая кнопка — Z).
// Направление света то же, что у DirectionalLight (−2.4, 5.2, −1.7).
const VIEW_APPLE = {
  xPx: 1513,
  topPx: 5,
  rotX: 69.7,
  rotY: -172.9,
  rotZ: -33.2,
  size: 1.54,
  azimuth: -90,
  elevation: 52,
  distance: 6.5422,
  intensity: 4.45,
  ambient: 0.72,
  lightMode: 'source',
  shadowDark: 0.09,
  shadowRadius: 11,
  lightOn: true,
  shadeSmooth: true,
  panelOpen: false,
};

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);
  const merged = BufferGeometryUtils.mergeVertices(source, 1e-4);
  source.dispose();
  merged.computeVertexNormals();
  return merged;
}

function applyShadeSmooth(root, smooth) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    if (!node.userData.flatGeometry) {
      node.userData.flatGeometry = node.geometry;
      node.userData.smoothGeometry = weldSmoothGeometry(node.geometry);
    }
    node.geometry = smooth ? node.userData.smoothGeometry : node.userData.flatGeometry;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const material of mats) {
      if (!material) continue;
      material.flatShading = !smooth;
      material.needsUpdate = true;
    }
  });
}

function mountViewportApple() {
  if (VIEW_APPLE.xPx == null) VIEW_APPLE.xPx = Math.round(innerWidth * 0.5);
  if (VIEW_APPLE.topPx == null) VIEW_APPLE.topPx = 0;

  const host = document.createElement('div');
  host.className = 'apple-view';
  host.setAttribute('aria-hidden', 'true');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.domElement.style.pointerEvents = 'none';
  host.appendChild(renderer.domElement);
  document.body.appendChild(host);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 40);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const fill = new THREE.AmbientLight(0xffffff, 0.62);
  scene.add(fill);
  const key = new THREE.DirectionalLight(0xfff7f2, VIEW_APPLE.intensity);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.00015;
  key.shadow.normalBias = 0.004;
  key.shadow.radius = VIEW_APPLE.shadowRadius;
  scene.add(key, key.target);

  const groundMat = new THREE.ShadowMaterial({ color: 0x000000, opacity: VIEW_APPLE.shadowDark });
  groundMat.depthWrite = false;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.renderOrder = 1;
  scene.add(ground);

  const tilt = new THREE.Group();
  tilt.rotation.order = 'XYZ';
  scene.add(tilt);

  let alive = true;
  let appleModel = null;
  let xInput = null;
  let topInput = null;
  let sizeInput = null;
  let shadeInput = null;
  let enterXInput = null;
  let enterTopInput = null;
  let enterRotXInput = null;
  let enterRotYInput = null;
  let enterRotZInput = null;

  // Mobile pose is locked on the 375 artboard. Screen pixels scale with
  // viewport width, the same ratio as .mob --k. Vertical position is
  // 18 design px from the top, so viewport height does not move it.
  // Desktop pose is only above 440px. Rotation is shared and does not scale.
  // At the open 1728px frame the apple anchor is x=1513, top=5. Column 12
  // of the stretch grid (margin 12, gutter 12) starts 72px to the right,
  // so the into-column offset is negative on the 1440 column-width scale.
  // Gutters stay 12px, and that offset still scales with the column width.
  const MOBILE_BOARD = 375;
  const DESK_GRID_MARGIN = 12;
  const DESK_GRID_GUTTER = 12;
  const DESK_GRID_COLS = 12;
  const DESK_APPLE_COL = 11;
  const DESK_COL_AT_1440 = (1440 - 2 * DESK_GRID_MARGIN - 11 * DESK_GRID_GUTTER) / DESK_GRID_COLS;
  const DESK_APPLE_REF_W = 1728;
  function desktopColumnWidth(width) {
    return (width - 2 * DESK_GRID_MARGIN - (DESK_GRID_COLS - 1) * DESK_GRID_GUTTER) / DESK_GRID_COLS;
  }
  const DESK_APPLE_INTO_COL = (1513
    - DESK_GRID_MARGIN
    - DESK_APPLE_COL * (desktopColumnWidth(DESK_APPLE_REF_W) + DESK_GRID_GUTTER))
    * DESK_COL_AT_1440 / desktopColumnWidth(DESK_APPLE_REF_W);
  function desktopAppleX(width) {
    const col = desktopColumnWidth(width);
    const into = DESK_APPLE_INTO_COL * (col / DESK_COL_AT_1440);
    return DESK_GRID_MARGIN + DESK_APPLE_COL * (col + DESK_GRID_GUTTER) + into;
  }
  function mobileFrameScale() {

    0.1,
    VIEW_APPLE.rotY + fly.rotY,
    flyDeg,
    (v) => {
      fly.rotY = v - VIEW_APPLE.rotY;
      restartAppleEnter();
    },
  );
  enterRotZInput = addFlySlider(
    'Поворот Z',
    -1080,
    1080,
    0.1,
    VIEW_APPLE.rotZ + fly.rotZ,
    flyDeg,
    (v) => {
      fly.rotZ = v - VIEW_APPLE.rotZ;
      restartAppleEnter();
    },
  );
  addFlyEase();
  addFlySlider(
    'Длительность',
    100,
    8000,
    10,
    fly.ms,
    (v) => Math.round(v) + ' мс',
    (v) => {
      fly.ms = v;
      restartAppleEnter();
    },
  );

  addHeading('Дизер');
  const ditherHint = document.createElement('p');
  ditherHint.className = 'hint';
  ditherHint.textContent = 'Ноль — нынешний порог. Зерно — сторона выборки.';
  panel.append(ditherHint);
  addDitherSlider('Плотность', -1, 1, 0.01, ditherBias, (v) => (v > 0 ? '+' : '') + v.toFixed(2), (v) => {
    ditherBias = v;
    pushDither();
  });
  addDitherSlider('Зерно', 40, 800, 1, ditherGrain, (v) => Math.round(v) + ' px', (v) => {
    ditherGrain = v;
    pushDither();
  });

  function afterRestPose() {
    syncEnterReadout();
    placeApple();
  }
  addHeading('Положение');
  xInput = addSlider('По горизонтали', 'xPx', -400, Math.ceil(innerWidth + 400), 1, (v) => Math.round(v) + ' px', afterRestPose);
  topInput = addSlider('От верха экрана', 'topPx', -400, Math.ceil(innerHeight + 400), 1, (v) => Math.round(v) + ' px', afterRestPose);
  sizeInput = addSlider('Размер', 'size', 0.2, 8, 0.01, (v) => Math.round(v * 100) + '%', afterRestPose);
  addHeading('Поворот яблока');
  addSlider('X', 'rotX', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  addSlider('Y', 'rotY', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  addSlider('Z', 'rotZ', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  const shadeChecks = document.createElement('div');
  shadeChecks.className = 'checks';
  const shadeLabel = document.createElement('label');
  shadeInput = document.createElement('input');
  shadeInput.type = 'checkbox';
  shadeInput.checked = VIEW_APPLE.shadeSmooth === true;
  shadeInput.setAttribute('aria-label', 'Shade Smooth');
  shadeLabel.append(shadeInput, document.createTextNode('Shade Smooth'));
  shadeInput.addEventListener('change', () => {
    VIEW_APPLE.shadeSmooth = shadeInput.checked;
    applyShadeSmooth(tilt, shadeInput.checked);
  });
  shadeChecks.append(shadeLabel);
  panel.append(shadeChecks);
  addHeading('Источник света');
  const lightChecks = document.createElement('div');
  lightChecks.className = 'checks';
  const lightLabel = document.createElement('label');
  const lightInput = document.createElement('input');
  lightInput.type = 'checkbox';
  lightInput.checked = VIEW_APPLE.lightOn !== false;
  lightInput.setAttribute('aria-label', 'Свет');
  lightLabel.append(lightInput, document.createTextNode('Свет'));
  lightInput.addEventListener('change', () => {
    VIEW_APPLE.lightOn = lightInput.checked;
    applyKeyLightAndPlace();
  });
  lightChecks.append(lightLabel);
  for (const [value, label] of [['map', 'Карта'], ['source', 'Источник']]) {
    const modeLabel = document.createElement('label');
    const modeInput = document.createElement('input');
    modeInput.type = 'radio';
    modeInput.name = 'apple-light-mode';
    modeInput.value = value;
    modeInput.checked = VIEW_APPLE.lightMode === value;
    modeInput.setAttribute('aria-label', label);
    modeInput.addEventListener('change', () => {
      if (!modeInput.checked) return;
      VIEW_APPLE.lightMode = value;
      applyKeyLightAndPlace();
    });
    modeLabel.append(modeInput, document.createTextNode(label));
    lightChecks.append(modeLabel);
  }
  panel.append(lightChecks);
  mapHint = document.createElement('p');
  mapHint.className = 'hint';
  mapHint.textContent = 'Только общее освещение, без лампы и тени.';
  mapHint.hidden = VIEW_APPLE.lightMode !== 'map';
  panel.append(mapHint);
  sourceBlock = document.createElement('div');
  sourceBlock.hidden = VIEW_APPLE.lightMode === 'map';
  addSlider('Общее освещение', 'ambient', 0, 2, 0.01, (v) => v.toFixed(2), null, sourceBlock);
  const ambientHint = document.createElement('p');
  ambientHint.className = 'hint';
  ambientHint.textContent = '0.72 и интенсивность 1.70 — свет яблока, которое ставит печать.';
  sourceBlock.append(ambientHint);
  addSlider('Азимут', 'azimuth', -180, 180, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Высота света', 'elevation', 5, 89, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Интенсивность', 'intensity', 0, 8, 0.05, (v) => v.toFixed(2), null, sourceBlock);
  const lightPos = document.createElement('p');
  lightPos.className = 'hint';
  sourceBlock.append(lightPos);
  addHeading('Тень света', sourceBlock);
  const castHint = document.createElement('p');
  castHint.className = 'hint';
  castHint.textContent = 'Яблоко отбрасывает тень от этого источника.';
  sourceBlock.append(castHint);
  addSlider('Темнота тени', 'shadowDark', 0, 1, 0.01, (v) => v.toFixed(2), placeApple, sourceBlock);
  addSlider('Мягкость карты тени', 'shadowRadius', 0, 80, 0.1, (v) => v.toFixed(1), placeApple, sourceBlock);
  panel.append(sourceBlock);
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'copy-json';
  copyBtn.textContent = 'Скопировать JSON';
  copyBtn.addEventListener('click', async () => {
    const round = (value, digits) => Number(Number(value).toFixed(digits));
    const json = JSON.stringify({
      xPx: Math.round(VIEW_APPLE.xPx),
      topPx: Math.round(VIEW_APPLE.topPx),
      size: round(VIEW_APPLE.size, 2),
      rotX: round(VIEW_APPLE.rotX, 1),
      rotY: round(VIEW_APPLE.rotY, 1),
      rotZ: round(VIEW_APPLE.rotZ, 1),
      lightOn: VIEW_APPLE.lightOn !== false,
      lightMode: VIEW_APPLE.lightMode === 'map' ? 'map' : 'source',
      ambient: round(VIEW_APPLE.ambient, 2),
      azimuth: Math.round(VIEW_APPLE.azimuth),
      elevation: Math.round(VIEW_APPLE.elevation),
      intensity: round(VIEW_APPLE.intensity, 2),
      shadowDark: round(VIEW_APPLE.shadowDark, 2),
      shadowRadius: round(VIEW_APPLE.shadowRadius, 1),
      shadeSmooth: VIEW_APPLE.shadeSmooth === true,
    }, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      copyBtn.textContent = 'Скопировано';
    } catch {
      copyBtn.textContent = 'Не скопировалось';
    }
    setTimeout(() => { copyBtn.textContent = 'Скопировать JSON'; }, 1200);
  });
  panel.append(copyBtn);
  document.body.appendChild(panel);

  function isTyping(event) {
    const el = event.target;
    if (!(el instanceof HTMLElement)) return false;
    if (el.isContentEditable) return true;
    const tag = el.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag !== 'INPUT') return false;
    const type = (el.type || 'text').toLowerCase();
    return !['range', 'checkbox', 'radio', 'button', 'submit', 'reset', 'color', 'file'].includes(type);
  }
  function onKey(event) {
    if (event.repeat) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.code === 'Escape') {
      if (panel.hidden) return;
      const el = event.target;
      const easeSelect = el instanceof HTMLSelectElement && panel.contains(el);
      if (!isTyping(event) || easeSelect) setOpen(false);
      return;
    }
    if (isTyping(event)) return;
    if (event.code !== 'KeyL') return;
    event.preventDefault();
    togglePanel();
  }
  addEventListener('keydown', onKey);
  addEventListener('resize', () => {
    applyAppleLayout();
    applyKeyLightAndPlace();
  });
  addEventListener('pointermove', onPointerMove);
  addEventListener('pointerleave', onPointerLeave);
  addEventListener('pointerdown', onApplePointerDown, { capture: true, passive: false });
  addEventListener('pointermove', onApplePointerMove, { passive: false });
  addEventListener('pointerup', onApplePointerUp);
  addEventListener('pointercancel', onApplePointerUp);

  loadGltf(APPLE_FILE).then((gltf) => {
    if (!alive || !gltf) return;
    const fitted = prepareApple(gltf, APPLE_GREEN);
    fitted.traverse((node) => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = false;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.shadowSide = THREE.DoubleSide;
    });
    const model = new THREE.Group();
    model.add(fitted);
    appleModel = model;
    tilt.add(model);
    host.classList.add('apple-shown');
    applyKeyLightAndPlace();
  });

  applyKeyLightAndPlace();
  renderer.setAnimationLoop(() => {
    if (!alive) return;
    maybeStartAppleEnter();
    const flying = !!(appleEnter && performance.now() - appleEnter.start < appleEnter.ms);
    if (!appleEnter || flying || !appleEnter.settled) {
      if (appleEnter && !flying) appleEnter.settled = true;
      applyKeyLightAndPlace();
    }
    followPointer();
    renderer.render(scene, camera);
    if (appleEnter) {
      const age = performance.now() - appleEnter.start;
      if (!globalThis.__enterTrace) globalThis.__enterTrace = [];
      const trace = globalThis.__enterTrace;
      const prev = trace[trace.length - 1];
      if (!prev || age - prev.age >= 220) {
        const rot = appleEnterRot();
        trace.push({
          age: Math.round(age),
          ease: Math.round(appleEnterEase() * 1000) / 1000,
          off: Math.round(appleEnterOffset()),
          y: Math.round(rot.y * 10) / 10,
          z: Math.round(rot.z * 10) / 10,
        });
      }
      if (!globalThis.__enterFrames) globalThis.__enterFrames = [];
      const bucket = Math.floor(age / 450);
      if (bucket <= 4 && !globalThis.__enterFrames[bucket]) {
        const snap = document.createElement('canvas');
        snap.width = 320;
        snap.height = 180;
        snap.getContext('2d').drawImage(renderer.domElement, 0, 0, 320, 180);
        globalThis.__enterFrames[bucket] = { age: Math.round(age), url: snap.toDataURL('image/jpeg', 0.6) };
      }
    }
  });

  function readViewportApple() {
    let casters = 0;
    let shading = null;
    tilt.traverse((node) => {
      if (node.isMesh && node.castShadow) casters += 1;
      if (shading || !node.isMesh) return;
      const mat = Array.isArray(node.material) ? node.material[0] : node.material;
      shading = {
        flatShading: !!mat?.flatShading,
        verts: node.geometry?.attributes?.position?.count ?? 0,
      };
    });
    return {
      ...VIEW_APPLE,
      shading,
      gazeX: gaze.sx,
      gazeY: gaze.sy,
      dragYaw: drag.yaw * 180 / Math.PI,
      dragPitch: drag.pitch * 180 / Math.PI,
      dragOn: drag.active,
      light: { x: key.position.x, y: key.position.y, z: key.position.z },
      keyIntensity: key.intensity,
      fillIntensity: fill.intensity,
      envIntensity: scene.environmentIntensity,
      castShadow: key.castShadow,
      model: APPLE_FILE,
      casters,
      shadowMap: !!key.shadow.map,
      groundOpacity: groundMat.opacity,
      appleY: tilt.position.y,
      extent: key.shadow.camera.right,
      enterEase: appleEnterEase(),
      enterOffset: appleEnterOffset(),
      enterAge: appleEnter ? performance.now() - appleEnter.start : -1,
      enterXOffset: appleEnterXOffset(),
      enterRotX: appleEnterRot().x,
      enterRotY: appleEnterRot().y,
      enterRotZ: appleEnterRot().z,
      enterMs: appleEnter ? appleEnter.ms : fly.ms,
      enterEaseName: appleEnter ? appleEnter.ease : fly.ease,
      tiltZ: tilt.position.z,
    };
  }
  readViewportApple.set = (patch) => {
    Object.assign(VIEW_APPLE, patch);
    applyKeyLightAndPlace();
  };
  globalThis.__viewportApple = readViewportApple;

  return () => {
    alive = false;
    removeEventListener('keydown', onKey);
    removeEventListener('resize', applyKeyLightAndPlace);
    removeEventListener('pointermove', onPointerMove);
    removeEventListener('pointerleave', onPointerLeave);
    removeEventListener('pointerdown', onApplePointerDown, true);
    removeEventListener('pointermove', onApplePointerMove);
    removeEventListener('pointerup', onApplePointerUp);
    removeEventListener('pointercancel', onApplePointerUp);
    if (globalThis.__vanokAppleGesture) delete globalThis.__vanokAppleGesture;
    renderer.setAnimationLoop(null);
    pmrem.dispose();
    renderer.dispose();
    host.remove();
    panel.remove();
    if (globalThis.__viewportApple) delete globalThis.__viewportApple;
  };
}

const SKIN = { color: 0x67c514, emissive: 0x7be81a, emissiveIntensity: 0.1, metalness: 0, roughness: 0.42 };
const STEM = { color: 0x7a4e28, emissive: 0x000000, emissiveIntensity: 0, metalness: 0, roughness: 0.64 };
const LEAF = { color: 0x2f861f, emissive: 0x14300a, emissiveIntensity: 0.18, metalness: 0, roughness: 0.52 };
const FLESH = { color: 0xf6e0b8, emissive: 0xf0d0a0, emissiveIntensity: 0.08, metalness: 0, roughness: 0.62 };
const SEED = { color: 0x6b3a22, emissive: 0x2a140c, emissiveIntensity: 0.04, metalness: 0, roughness: 0.5 };
const LOOK = {
  PaleGreen: SKIN,
  green: SKIN,
  DarkBrown: STEM,
  brown: STEM,
  _defaultMat: STEM,
  DarkGreen: LEAF,
  brownLight: FLESH,
  brownDark: SEED,
};

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

mountSignStamp(document.getElementById('sign-host'));
mountViewportApple();
