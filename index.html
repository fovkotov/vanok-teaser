<script>
  (function () {
    var themes = ['0', '1', '2'];
    var root = document.documentElement;
    if (!root.dataset.theme) root.dataset.theme = '0';
    function cycle(event) {
      event.preventDefault();
      var i = themes.indexOf(root.dataset.theme || '0');
      if (i < 0) i = 0;
      root.dataset.theme = themes[(i + 1) % themes.length];
      root.dispatchEvent(new CustomEvent('vanok-theme'));
    }
    var buttons = document.querySelectorAll('.crosshair');
    for (var n = 0; n < buttons.length; n++) buttons[n].addEventListener('click', cycle);
  })();
</script>

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

const APPLE_FILE = 'models/apple_green_quaternius.glb';
const STAMP_FILE = 'models/stamp_round.glb';
const APPLE_GREEN = 0x67c514;
const APPLE_RED = 0xe23b32;
const STAMP_GREEN = 0x67c514;

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (skinHex != null && (m.name === 'PaleGreen' || m.name === 'green')) {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  paintApple(model);
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
  return fitTopDown(model);
}

  const pct = (n) => Math.round(n * 100) + '%';

    const tintRow = document.createElement('label');

    const checks = document.createElement('div');

    if (!prints) return;

    const ui = { kind: ink ? 'stamp' : 'apple', rig, lastPlaced: '' };
    function addSelect(label, value, options, onChange) {
      const wrap = document.createElement('label');
      wrap.className = 'row';

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  const stampTab = document.createElement('button');
  stampTab.type = 'button';
  stampTab.textContent = 'Печать';

  applePane.hidden = true;
  fillPane(stampPane, stampRig, true, STAMP_IMPRINTS);
  fillPane(applePane, appleRig, false, APPLE_IMPRINTS);
  function showPane(which) {

  stampTab.addEventListener('click', () => showPane('stamp'));
  appleTab.addEventListener('click', () => showPane('apple'));
  const scrollHost = document.createElement('div');
  addSlider(scrollHost, pageScroll, 'Ускорение лент при скролле', 'boost', 1, 30, 0.5, (n) => n.toFixed(1) + '×', false);
  panel.append(scrollHost, tabs, stampPane, applePane);

  let alive = true;
  let stampModel = null;
  let appleModel = null;
  let pressN = 0;
  let lastNow = 0;
  const marks = [];
  const flights = [];
  const queued = [];

  function refreshFiles() {
    for (const ui of fileUis) {
      const show = ui.rig.file === 'random' ? ui.lastPlaced : ui.rig.file;
      ui.next.textContent = ui.rig.file === 'random'
        ? 'Дальше: случайный'
        : 'Дальше: ' + ui.rig.file;
      for (const btn of ui.thumbs) btn.classList.toggle('on', !!show && btn.dataset.file === show);
    }
  }
  refreshFiles();

  function placeInk(current) {
    if (current.placed || !current.src) return;
    current.placed = true;
    if (current.rig.stack === 'replace') {
      for (let i = marks.length - 1; i >= 0; i--) {
        if (marks[i].kind !== current.kind) continue;
        marks[i].el.remove();
        marks.splice(i, 1);
      }
    }
    const el = document.createElement('div');
    el.className = 'sign-imprint';
    const img = document.createElement('img');
    img.className = 'ink';
    img.alt = '';
    img.draggable = false;
    img.src = current.src;
    const dye = document.createElement('div');
    dye.className = 'dye';
    dye.style.webkitMaskImage = `url("${current.src}")`;
    dye.style.maskImage = `url("${current.src}")`;
    el.append(img, dye);
    layer.append(el);
    marks.push({
      el,
      dye,
      kind: current.kind,
      rot: current.rot,
      px: current.px,
      py: current.py,
    });
    const ui = fileUis.find((item) => item.kind === current.kind);
    if (ui) {
      ui.lastPlaced = current.file;
      ui.last.textContent = 'Поставлен: ' + current.file;
    }
    paintMarks();
  }
  const colorDeck = [];
  let lastColor = '';
  function drawColor() {
    if (!colorDeck.length) {
      const colors = ['blue', 'pink', 'green'];
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      if (colors[colors.length - 1] === lastColor) {
        [colors[0], colors[colors.length - 1]] = [colors[colors.length - 1], colors[0]];
      }
      colorDeck.push(...colors);
    }
    lastColor = colorDeck.pop();
    return lastColor;
  }
  function pickCast(kind) {
    const casts = kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
    const list = kind === 'apple' ? APPLE_IMPRINTS : STAMP_IMPRINTS;
    const rig = kind === 'apple' ? appleRig : stampRig;
    let cast = casts.find((item) => item.file === rig.file);
    if (!cast) {
      const color = drawColor();
      cast = casts.find((item) => item.color === color) || casts[0];
    } else {
      lastColor = cast.color;
    }
    const imprint = list.find((item) => item.file === cast.file) || list[0];
    const themed = themeHex();
    return { ...imprint, castHex: cast.hex, bodyHex: themed == null ? cast.hex : themed };
  }

  function themeHex() {
    const theme = document.documentElement.dataset.theme || '0';
    if (theme === '1') return 0x8a7e59;
    if (theme === '2') return 0xe3f4e8;
    return null;
  }

  function sampleShot(point, rig, kind) {
    const choice = pickCast(kind);
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const h = host.clientHeight;
    if (host.clientWidth < 2 || h < 2) return;
    for (const mark of marks) {
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const imgW = mark.kind === 'apple'
        ? (SIZE * rig.scale / viewH) * h
        : ((SIZE * rig.scale / viewH) * h) / INK_FRAC;
      mark.el.style.left = `calc(${mark.px * 100}% + ${rig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${rig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(rig.opacity);
      mark.el.style.filter = rig.blur > 0.01 ? `blur(${rig.blur}px)` : 'none';
      const rot = mark.kind === 'apple' ? rig.pressY - mark.rot : mark.rot;
      mark.el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      const themed = themeHex();
      if (themed == null) {
        mark.dye.style.opacity = String(rig.tintAmount);
        mark.dye.style.background = rig.tint;
      } else {
        mark.dye.style.opacity = '1';
        mark.dye.style.background = '#' + themed.toString(16).padStart(6, '0');
      }
    }
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : current.rig.printScale);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(flight, prefix) {
    const d = Math.PI / 180;
    const rig = flight.shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(flight, name, u) {
    const start = axisPose(flight, 'start');
    const fly = axisPose(flight, 'fly');
    const press = axisPose(flight, 'press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function paintTool(root, kind, hex) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (kind === 'apple') {
          if (material.name !== 'green' && material.name !== 'PaleGreen') continue;
          material.color.setHex(hex);
          material.emissive.setHex(hex);
          material.emissiveIntensity = 0.08;
          continue;
        }
        const color = new THREE.Color(hex);
        if (node.name === 'Pad') color.multiplyScalar(0.78);
        else if (node.name === 'Handle') color.multiplyScalar(0.9);
        material.color.copy(color);
      }
    });
  }

  function cloneTool(source) {
    const clone = source.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map((material) => material.clone())
        : node.material.clone();
    });
    clone.visible = false;
    scene.add(clone);
    return clone;
  }

  function cloneShadow() {
    const mesh = shadow.clone();
    mesh.material = shadow.material.clone();
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function releaseFlight(flight) {
    scene.remove(flight.model);
    flight.model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.dispose();
    });
    scene.remove(flight.shadow);
    flight.shadow.material.dispose();
    flight.model.visible = false;
    flight.shadow.visible = false;
  }

  function applyPose(flight, x, z, squashAmt, rot, presence, spin) {
    const shot = flight.shot;
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : rig.printScale);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor(flight, 'press', 1);
    const model = flight.model;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    if (shot.bodyHex != null) paintTool(model, shot.kind, shot.bodyHex);
    const shade = flight.shadow;
    shade.visible = true;
    shade.position.set(x + 0.04, 0.002, z + 0.03);
    shade.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shade.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
    const source = kindReady(kind);
    if (!source) {
      queued.push(point);
      return;
    }
    pressN += 1;
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const shot = sampleShot(point, rig, kind);
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((item) => item.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }

  function drainQueue() {
    while (queued.length) {
      const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
      if (!kindReady(kind)) return;
      start(queued.shift());
    }
  }

  function stepFlight(flight, dt) {
    const shot = flight.shot;
    if (flight.phase === 'rest') {
      if (shot.rig.liftAway) {
        flight.phase = 'lift';
        flight.phaseU = 0;
      } else {
        const goal = targetOf(shot);
        applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      }
      return false;
    }
    const goal = targetOf(shot);
    if (flight.phase === 'descend') {
      flight.phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, flight.phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(flight, goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor(flight, 'descend', u));
      if (u >= 1) { flight.phase = 'press'; flight.phaseU = 0; }
    } else if (flight.phase === 'press') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      applyPose(flight, goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'repress') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(flight, goal.x, goal.z, sq, shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'dwell') {
      applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
        flight.phaseU = 0;
      } else {
        flight.phaseU += dt / shot.rig.dwell;
        if (flight.phaseU >= 1) {
          flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
          flight.phaseU = 0;
        }
      }
    } else if (flight.phase === 'lift') {
      flight.phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, flight.phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(flight, goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor(flight, 'lift', u));
      if (u >= 1) {
        releaseFlight(flight);
        return true;
      }
    }
    return false;
  }

  function step(dt) {
    for (let i = flights.length - 1; i >= 0; i--) {
      if (stepFlight(flights[i], dt)) flights.splice(i, 1);
    }
  }

  function onClick(e) {
    if (!alive || e.button) return;
    const blocked = e.target && e.target.closest && e.target.closest(
      '.stamp-panel, .apple-light, .crosshair'
    );
    if (blocked) return;
    const hr = host.getBoundingClientRect();
    const point = { px: e.clientX - hr.left, py: e.clientY - hr.top };
    start(point);
  }
  addEventListener('click', onClick, true);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    group.add(fitted);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  new GLTFLoader().load('models/stamp_round.glb', (gltf) => {
    if (!alive) return;
    mountTool('stamp', fitTopDown(prepareStamp(gltf.scene)));
  });
  new GLTFLoader().load('models/apple_half_green.glb', (gltf) => {
    if (!alive) return;
    mountTool('apple', prepareHalfApple(gltf));
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    placeStage();
    renderer.render(scene, camera);
  });

  function applyThemeInk() {
    const themed = themeHex();
    for (const flight of flights) {
      if (flight.shot.castHex != null) {
        flight.shot.bodyHex = themed == null ? flight.shot.castHex : themed;
      }
    }
    paintMarks();
  }
  document.documentElement.addEventListener('vanok-theme', applyThemeInk);

  return () => {
    alive = false;
    while (flights.length) releaseFlight(flights.pop());
    document.documentElement.removeEventListener('vanok-theme', applyThemeInk);
    removeEventListener('click', onClick, true);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Поза шапки до возврата фото: Euler XYZ, как у перетаскивания
// (горизонталь — Y, вертикаль — X, Shift / правая кнопка — Z).
// Направление света то же, что у DirectionalLight (−2.4, 5.2, −1.7).
const VIEW_APPLE = {
  xPx: 1290,
  topPx: 0,
  rotX: 59.3,
  rotY: -142.3,
  rotZ: -18.2,
  size: 1.88,
  azimuth: -90,
  elevation: 52,
  distance: 6.5422,
  intensity: 4.45,
  ambient: 0.72,
  lightMode: 'source',
  shadowDark: 0.09,
  shadowRadius: 11,
  lightOn: true,
  shadeSmooth: true,
  panelOpen: false,
};

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);
  const merged = BufferGeometryUtils.mergeVertices(source, 1e-4);
  source.dispose();
  merged.computeVertexNormals();
  return merged;
}

function applyShadeSmooth(root, smooth) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    if (!node.userData.flatGeometry) {
      node.userData.flatGeometry = node.geometry;
      node.userData.smoothGeometry = weldSmoothGeometry(node.geometry);
    }
    node.geometry = smooth ? node.userData.smoothGeometry : node.userData.flatGeometry;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const material of mats) {
      if (!material) continue;
      material.flatShading = !smooth;
      material.needsUpdate = true;
    }
  });
}

function mountViewportApple() {
  if (VIEW_APPLE.xPx == null) VIEW_APPLE.xPx = Math.round(innerWidth * 0.5);
  if (VIEW_APPLE.topPx == null) VIEW_APPLE.topPx = 0;

  const host = document.createElement('div');
  host.className = 'apple-view';
  host.setAttribute('aria-hidden', 'true');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.domElement.style.pointerEvents = 'none';
  host.appendChild(renderer.domElement);
  document.body.appendChild(host);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 40);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const fill = new THREE.AmbientLight(0xffffff, 0.62);
  scene.add(fill);
  const key = new THREE.DirectionalLight(0xfff7f2, VIEW_APPLE.intensity);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.00015;
  key.shadow.normalBias = 0.004;
  key.shadow.radius = VIEW_APPLE.shadowRadius;
  scene.add(key, key.target);

  const groundMat = new THREE.ShadowMaterial({ color: 0x000000, opacity: VIEW_APPLE.shadowDark });
  groundMat.depthWrite = false;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.renderOrder = 1;
  scene.add(ground);

  const tilt = new THREE.Group();
  tilt.rotation.order = 'XYZ';
  scene.add(tilt);

  let alive = true;
  let appleModel = null;
  let xInput = null;
  let topInput = null;
  let sizeInput = null;
  let shadeInput = null;
  let appleOnMobile = null;

  // Mobile pose is locked on the 375 artboard. Screen pixels scale with
  // viewport width, the same ratio as .mob --k. Vertical position is
  // −18 design px from the top, so viewport height does not move it.
  // Desktop pose is only above 440px.
  const MOBILE_BOARD = 375;
  function mobileFrameScale() {
    return Math.max(innerWidth, 1) / MOBILE_BOARD;
  }
  function applyAppleLayout() {
    const mobile = matchMedia('(max-width: 440px)').matches;
    if (mobile) {
      const k = mobileFrameScale();
      VIEW_APPLE.size = 5.34 * k;
      VIEW_APPLE.xPx = 104 * k;
      VIEW_APPLE.topPx = -18 * k;
    } else if (appleOnMobile !== false) {
      VIEW_APPLE.xPx = 1290;
      VIEW_APPLE.topPx = 0;
      VIEW_APPLE.size = 1.88;
    }
    appleOnMobile = mobile;
    writeAppleSlider(xInput, 'xPx', (v) => Math.round(v) + ' px');
    writeAppleSlider(topInput, 'topPx', (v) => Math.round(v) + ' px');
    writeAppleSlider(sizeInput, 'size', (v) => Math.round(v * 100) + '%');
  }
  function writeAppleSlider(input, keyName, format) {
    if (!input) return;
    input.value = String(VIEW_APPLE[keyName]);
    const label = input.parentElement && input.parentElement.querySelector('i');
    if (label) label.textContent = format(Number(input.value));
  }
  let sourceBlock = null;
  let mapHint = null;
  const shadowBox = new THREE.Box3();
  const shadowSize = new THREE.Vector3();
  const shadowCenter = new THREE.Vector3();
  const lightDir = new THREE.Vector3();
  const gaze = { x: 0, y: 0, sx: 0, sy: 0 };
  const gazeBase = new THREE.Quaternion();
  const gazeEuler = new THREE.Euler(0, 0, 0, 'XYZ');
  const gazePitch = new THREE.Quaternion();
  const gazeYaw = new THREE.Quaternion();
  const axisX = new THREE.Vector3(1, 0, 0);
  const axisUp = new THREE.Vector3(0, 0, -1);
  const GAZE = 8 * Math.PI / 180;

  function followPointer() {
    gaze.sx += (gaze.x - gaze.sx) * 0.08;
    gaze.sy += (gaze.y - gaze.sy) * 0.08;
    gazeEuler.set(
      VIEW_APPLE.rotX * Math.PI / 180,
      VIEW_APPLE.rotY * Math.PI / 180,
      VIEW_APPLE.rotZ * Math.PI / 180,
    );
    gazeBase.setFromEuler(gazeEuler);
    gazePitch.setFromAxisAngle(axisX, gaze.sy * GAZE);
    gazeYaw.setFromAxisAngle(axisUp, gaze.sx * GAZE);
    gazeYaw.multiply(gazePitch);
    tilt.quaternion.copy(gazeYaw).multiply(gazeBase);
    tilt.updateMatrixWorld(true);
    shadowBox.setFromObject(tilt);
    if (!shadowBox.isEmpty() && Number.isFinite(shadowBox.min.y)) {
      tilt.position.y += 0.012 - shadowBox.min.y;
    }
  }

  function onPointerMove(event) {
    const w = Math.max(innerWidth, 1);
    const h = Math.max(innerHeight, 1);
    gaze.x = (event.clientX / w) * 2 - 1;
    gaze.y = (event.clientY / h) * 2 - 1;
  }
  function onPointerLeave() {
    gaze.x = 0;
    gaze.y = 0;
  }

  function applySurfaceLight(lit) {
    tilt.traverse((node) => {
      if (!node.isMesh) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (!material) continue;
        if (material.userData.litEmissive == null) {
          material.userData.litEmissive = material.emissiveIntensity;
          material.userData.litEnv = material.envMapIntensity;
        }
        material.emissiveIntensity = lit === 'off' ? 0 : material.userData.litEmissive;
        material.envMapIntensity = 0;
      }
    });
  }

  function placeApple() {
    if (!alive) return;
    applyShadeSmooth(tilt, VIEW_APPLE.shadeSmooth === true);
    if (shadeInput) shadeInput.checked = VIEW_APPLE.shadeSmooth === true;
    const w = Math.max(innerWidth, 2);
    const h = Math.max(innerHeight, 2);
    const headerH = 306 * (w / 1440);
    const viewH = 2.4 * (h / headerH);
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    // The camera already zooms with viewport width. On mobile, VIEW_APPLE.size
    // includes that same scale, so the mesh stays on the 375 pose.
    const poseSize = matchMedia('(max-width: 440px)').matches
      ? VIEW_APPLE.size / mobileFrameScale()
      : VIEW_APPLE.size;
    if (appleModel) appleModel.scale.setScalar(0.78 * poseSize);
    tilt.position.set(
      (VIEW_APPLE.xPx / w) * viewW - viewW / 2,
      0,
      (VIEW_APPLE.topPx / h) * viewH - viewH / 2,
    );
    tilt.rotation.set(
      VIEW_APPLE.rotX * Math.PI / 180,
      VIEW_APPLE.rotY * Math.PI / 180,
      VIEW_APPLE.rotZ * Math.PI / 180,
    );
    tilt.updateMatrixWorld(true);
    shadowBox.setFromObject(tilt);
    const az = VIEW_APPLE.azimuth * Math.PI / 180;
    const el = Math.max(VIEW_APPLE.elevation * Math.PI / 180, 0.087);
    let reach = 1.4;
    let focusX = tilt.position.x;
    let focusZ = tilt.position.z;
    if (!shadowBox.isEmpty() && Number.isFinite(shadowBox.min.y)) {
      tilt.position.y = -shadowBox.min.y + 0.012;
      tilt.updateMatrixWorld(true);
      shadowBox.setFromObject(tilt);
      shadowBox.getSize(shadowSize);
      shadowBox.getCenter(shadowCenter);
      reach = Math.min(8, (shadowSize.y + 0.04) / Math.tan(el));
      focusX = shadowCenter.x - Math.sin(az) * reach * 0.5;
      focusZ = shadowCenter.z - Math.cos(az) * reach * 0.5;
      const extent = Math.max(shadowSize.x, shadowSize.z) * 0.9 + reach * 0.7 + 0.45;
      const cam = key.shadow.camera;
      cam.left = -extent;
      cam.right = extent;
      cam.top = extent;
      cam.bottom = -extent;
      cam.near = 0.15;
      cam.far = VIEW_APPLE.distance + reach + shadowSize.y + 6;
      cam.updateProjectionMatrix();
    }
    lightDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    key.target.position.set(focusX, 0.02, focusZ);
    key.position.copy(key.target.position).addScaledVector(lightDir, VIEW_APPLE.distance);
    const mode = VIEW_APPLE.lightOn === false
      ? 'off'
      : (VIEW_APPLE.lightMode === 'map' ? 'map' : 'source');
    key.castShadow = mode === 'source';
    key.intensity = mode === 'source' ? VIEW_APPLE.intensity : 0;
    fill.intensity = mode === 'off' ? 0 : VIEW_APPLE.ambient;
    scene.environmentIntensity = 0;
    key.shadow.radius = VIEW_APPLE.shadowRadius;
    groundMat.opacity = mode === 'source'
      ? Math.min(1, VIEW_APPLE.shadowDark * (VIEW_APPLE.intensity / 2.5))
      : 0;
    applySurfaceLight(mode);
    key.target.updateMatrixWorld();
    ground.position.set(0, 0, 0);
    ground.scale.set(viewW * 1.4, viewH * 1.4, 1);
    if (xInput) {
      xInput.max = String(Math.ceil(w + 400));
      topInput.max = String(Math.ceil(h + 400));
    }
    followPointer();
  }

  function applyKeyLightAndPlace() {
    placeApple();
    if (lightPos) {
      lightPos.textContent =
        `x ${key.position.x.toFixed(2)}   y ${key.position.y.toFixed(2)}   z ${key.position.z.toFixed(2)}`;
    }
    const map = VIEW_APPLE.lightMode === 'map';
    if (sourceBlock) sourceBlock.hidden = map;
    if (mapHint) mapHint.hidden = !map;
  }

  const panel = document.createElement('aside');
  panel.className = 'apple-light';
  panel.hidden = !VIEW_APPLE.panelOpen;
  panel.setAttribute('aria-label', 'Настройки яблока');
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'close';
  close.textContent = 'Закрыть';
  const title = document.createElement('h2');
  title.textContent = 'Яблоко';
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Клавиша L открывает панель. Esc закрывает.';
  panel.append(close, title, hint);

  function setOpen(open) {
    VIEW_APPLE.panelOpen = open;
    panel.hidden = !open;
  }
  function togglePanel() { setOpen(panel.hidden); }
  close.addEventListener('click', () => setOpen(false));

  function addHeading(text, parent = panel) {
    const heading = document.createElement('h3');
    heading.textContent = text;
    parent.append(heading);
  }
  function addSlider(label, keyName, min, max, step, format, after, parent = panel) {
    const row = document.createElement('label');
    row.className = 'row';
    const head = document.createElement('span');
    const name = document.createElement('b');
    name.textContent = label;
    const value = document.createElement('i');
    const input = document.createElement('input');
    input.type = 'range';
    input.min = String(min);
    input.max = String(max);
    input.step = String(step);
    input.value = String(VIEW_APPLE[keyName]);
    input.setAttribute('aria-label', label);
    const paintValue = () => { value.textContent = format(Number(input.value)); };
    input.addEventListener('input', (event) => {
      if (!event.isTrusted) return;
      VIEW_APPLE[keyName] = Number(input.value);
      paintValue();
      if (after) after();
      else applyKeyLightAndPlace();
    });
    paintValue();
    head.append(name, value);
    row.append(head, input);
    parent.append(row);
    return input;
  }

  applyAppleLayout();
  addHeading('Положение');
  xInput = addSlider('По горизонтали', 'xPx', -400, Math.ceil(innerWidth + 400), 1, (v) => Math.round(v) + ' px', placeApple);
  topInput = addSlider('От верха экрана', 'topPx', -400, Math.ceil(innerHeight + 400), 1, (v) => Math.round(v) + ' px', placeApple);
  sizeInput = addSlider('Размер', 'size', 0.2, 8, 0.01, (v) => Math.round(v * 100) + '%', placeApple);
  addHeading('Поворот яблока');
  addSlider('X', 'rotX', -180, 180, 0.1, (v) => v.toFixed(1) + '°', placeApple);
  addSlider('Y', 'rotY', -180, 180, 0.1, (v) => v.toFixed(1) + '°', placeApple);
  addSlider('Z', 'rotZ', -180, 180, 0.1, (v) => v.toFixed(1) + '°', placeApple);
  const shadeChecks = document.createElement('div');
  shadeChecks.className = 'checks';
  const shadeLabel = document.createElement('label');
  shadeInput = document.createElement('input');
  shadeInput.type = 'checkbox';
  shadeInput.checked = VIEW_APPLE.shadeSmooth === true;
  shadeInput.setAttribute('aria-label', 'Shade Smooth');
  shadeLabel.append(shadeInput, document.createTextNode('Shade Smooth'));
  shadeInput.addEventListener('change', () => {
    VIEW_APPLE.shadeSmooth = shadeInput.checked;
    applyShadeSmooth(tilt, shadeInput.checked);
  });
  shadeChecks.append(shadeLabel);
  panel.append(shadeChecks);
  addHeading('Источник света');
  const lightChecks = document.createElement('div');
  lightChecks.className = 'checks';
  const lightLabel = document.createElement('label');
  const lightInput = document.createElement('input');
  lightInput.type = 'checkbox';
  lightInput.checked = VIEW_APPLE.lightOn !== false;
  lightInput.setAttribute('aria-label', 'Свет');
  lightLabel.append(lightInput, document.createTextNode('Свет'));
  lightInput.addEventListener('change', () => {
    VIEW_APPLE.lightOn = lightInput.checked;
    applyKeyLightAndPlace();
  });
  lightChecks.append(lightLabel);
  for (const [value, label] of [['map', 'Карта'], ['source', 'Источник']]) {
    const modeLabel = document.createElement('label');
    const modeInput = document.createElement('input');
    modeInput.type = 'radio';
    modeInput.name = 'apple-light-mode';
    modeInput.value = value;
    modeInput.checked = VIEW_APPLE.lightMode === value;
    modeInput.setAttribute('aria-label', label);
    modeInput.addEventListener('change', () => {
      if (!modeInput.checked) return;
      VIEW_APPLE.lightMode = value;
      applyKeyLightAndPlace();
    });
    modeLabel.append(modeInput, document.createTextNode(label));
    lightChecks.append(modeLabel);
  }
  panel.append(lightChecks);
  mapHint = document.createElement('p');
  mapHint.className = 'hint';
  mapHint.textContent = 'Только общее освещение, без лампы и тени.';
  mapHint.hidden = VIEW_APPLE.lightMode !== 'map';
  panel.append(mapHint);
  sourceBlock = document.createElement('div');
  sourceBlock.hidden = VIEW_APPLE.lightMode === 'map';
  addSlider('Общее освещение', 'ambient', 0, 2, 0.01, (v) => v.toFixed(2), null, sourceBlock);
  const ambientHint = document.createElement('p');
  ambientHint.className = 'hint';
  ambientHint.textContent = '0.72 и интенсивность 1.70 — свет яблока, которое ставит печать.';
  sourceBlock.append(ambientHint);
  addSlider('Азимут', 'azimuth', -180, 180, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Высота света', 'elevation', 5, 89, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Интенсивность', 'intensity', 0, 8, 0.05, (v) => v.toFixed(2), null, sourceBlock);
  const lightPos = document.createElement('p');
  lightPos.className = 'hint';
  sourceBlock.append(lightPos);
  addHeading('Тень света', sourceBlock);
  const castHint = document.createElement('p');
  castHint.className = 'hint';
  castHint.textContent = 'Яблоко отбрасывает тень от этого источника.';
  sourceBlock.append(castHint);
  addSlider('Темнота тени', 'shadowDark', 0, 1, 0.01, (v) => v.toFixed(2), placeApple, sourceBlock);
  addSlider('Мягкость карты тени', 'shadowRadius', 0, 80, 0.1, (v) => v.toFixed(1), placeApple, sourceBlock);
  panel.append(sourceBlock);
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'copy-json';
  copyBtn.textContent = 'Скопировать JSON';
  copyBtn.addEventListener('click', async () => {
    const round = (value, digits) => Number(Number(value).toFixed(digits));
    const json = JSON.stringify({
      xPx: Math.round(VIEW_APPLE.xPx),
      topPx: Math.round(VIEW_APPLE.topPx),
      size: round(VIEW_APPLE.size, 2),
      rotX: round(VIEW_APPLE.rotX, 1),
      rotY: round(VIEW_APPLE.rotY, 1),
      rotZ: round(VIEW_APPLE.rotZ, 1),
      lightOn: VIEW_APPLE.lightOn !== false,
      lightMode: VIEW_APPLE.lightMode === 'map' ? 'map' : 'source',
      ambient: round(VIEW_APPLE.ambient, 2),
      azimuth: Math.round(VIEW_APPLE.azimuth),
      elevation: Math.round(VIEW_APPLE.elevation),
      intensity: round(VIEW_APPLE.intensity, 2),
      shadowDark: round(VIEW_APPLE.shadowDark, 2),
      shadowRadius: round(VIEW_APPLE.shadowRadius, 1),
      shadeSmooth: VIEW_APPLE.shadeSmooth === true,
    }, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      copyBtn.textContent = 'Скопировано';
    } catch {
      copyBtn.textContent = 'Не скопировалось';
    }
    setTimeout(() => { copyBtn.textContent = 'Скопировать JSON'; }, 1200);
  });
  panel.append(copyBtn);
  document.body.appendChild(panel);

  function isTyping(event) {
    const el = event.target;
    if (!(el instanceof HTMLElement)) return false;
    if (el.isContentEditable) return true;
    const tag = el.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag !== 'INPUT') return false;
    const type = (el.type || 'text').toLowerCase();
    return !['range', 'checkbox', 'radio', 'button', 'submit', 'reset', 'color', 'file'].includes(type);
  }
  function onKey(event) {
    if (event.repeat || isTyping(event)) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.code === 'Escape') {
      if (!panel.hidden) setOpen(false);
      return;
    }
    if (event.code !== 'KeyL') return;
    event.preventDefault();
    togglePanel();
  }
  addEventListener('keydown', onKey);
  addEventListener('resize', () => {
    applyAppleLayout();
    applyKeyLightAndPlace();
  });
  addEventListener('pointermove', onPointerMove);
  addEventListener('pointerleave', onPointerLeave);

  new GLTFLoader().load(APPLE_FILE, (gltf) => {
    if (!alive) return;
    const fitted = prepareApple(gltf, APPLE_GREEN);
    fitted.traverse((node) => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = false;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.shadowSide = THREE.DoubleSide;
    });
    const model = new THREE.Group();
    model.add(fitted);
    appleModel = model;
    tilt.add(model);
    applyKeyLightAndPlace();
  });

  applyKeyLightAndPlace();
  renderer.setAnimationLoop(() => {
    if (!alive) return;
    followPointer();
    renderer.render(scene, camera);
  });

  function readViewportApple() {
    let casters = 0;
    let shading = null;
    tilt.traverse((node) => {
      if (node.isMesh && node.castShadow) casters += 1;
      if (shading || !node.isMesh) return;
      const mat = Array.isArray(node.material) ? node.material[0] : node.material;
      shading = {
        flatShading: !!mat?.flatShading,
        verts: node.geometry?.attributes?.position?.count ?? 0,
      };
    });
    return {
      ...VIEW_APPLE,
      shading,
      gazeX: gaze.sx,
      gazeY: gaze.sy,
      light: { x: key.position.x, y: key.position.y, z: key.position.z },
      keyIntensity: key.intensity,
      fillIntensity: fill.intensity,
      envIntensity: scene.environmentIntensity,
      castShadow: key.castShadow,
      model: APPLE_FILE,
      casters,
      shadowMap: !!key.shadow.map,
      groundOpacity: groundMat.opacity,
      appleY: tilt.position.y,
      extent: key.shadow.camera.right,
    };
  }
  readViewportApple.set = (patch) => {
    Object.assign(VIEW_APPLE, patch);
    applyKeyLightAndPlace();
  };
  globalThis.__viewportApple = readViewportApple;

  return () => {
    alive = false;
    removeEventListener('keydown', onKey);
    removeEventListener('resize', applyKeyLightAndPlace);
    removeEventListener('pointermove', onPointerMove);
    removeEventListener('pointerleave', onPointerLeave);
    renderer.setAnimationLoop(null);
    pmrem.dispose();
    renderer.dispose();
    host.remove();
    panel.remove();
    if (globalThis.__viewportApple) delete globalThis.__viewportApple;
  };
}

const SKIN = { color: 0x67c514, emissive: 0x7be81a, emissiveIntensity: 0.1, metalness: 0, roughness: 0.42 };
const STEM = { color: 0x7a4e28, emissive: 0x000000, emissiveIntensity: 0, metalness: 0, roughness: 0.64 };
const LEAF = { color: 0x2f861f, emissive: 0x14300a, emissiveIntensity: 0.18, metalness: 0, roughness: 0.52 };
const FLESH = { color: 0xf6e0b8, emissive: 0xf0d0a0, emissiveIntensity: 0.08, metalness: 0, roughness: 0.62 };
const SEED = { color: 0x6b3a22, emissive: 0x2a140c, emissiveIntensity: 0.04, metalness: 0, roughness: 0.5 };
const LOOK = {
  PaleGreen: SKIN,
  green: SKIN,
  DarkBrown: STEM,
  brown: STEM,
  _defaultMat: STEM,
  DarkGreen: LEAF,
  brownLight: FLESH,
  brownDark: SEED,
};

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

mountSignStamp(document.getElementById('sign-host'));
mountViewportApple();
